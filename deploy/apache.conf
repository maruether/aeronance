# Aeronance -- Apache-Beispiel (mod_proxy_fcgi zu PHP-FPM).
#
# Voraussetzungen: a2enmod rewrite proxy_fcgi setenvif headers ssl http2
#
# Wie beim nginx-Beispiel gilt: DocumentRoot zeigt auf public/ und nur dorthin.
# Eine Ebene höher wären .env und storage/ über HTTP lesbar.

<VirtualHost *:80>
    ServerName werkstatt.example.org

    # ACME offen lassen, sonst erneuert sich das Zertifikat nicht.
    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory /var/www/letsencrypt/.well-known/acme-challenge/>
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName werkstatt.example.org
    DocumentRoot /var/www/aeronance/public

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/werkstatt.example.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/werkstatt.example.org/privkey.pem

    Protocols h2 http/1.1

    # HSTS erst setzen, wenn HTTPS steht -- Browser merken es sich.
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "no-referrer"

    <Directory /var/www/aeronance/public>
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.4-fpm-aeronance.sock|fcgi://localhost"
    </FilesMatch>

    # Grosszügig genug für einen eingescannten Wägebericht.
    LimitRequestBody 33554432

    ErrorLog  ${APACHE_LOG_DIR}/aeronance-error.log
    CustomLog ${APACHE_LOG_DIR}/aeronance-access.log combined
</VirtualHost>
