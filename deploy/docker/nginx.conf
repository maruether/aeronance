# nginx im Container-Verbund.
#
# ──────────────────────────────────────────────────────────────────────────────
# BEWUSST OHNE TLS, anders als deploy/nginx.conf für den eigenen Server. Ein
# Container-Stack steht praktisch immer hinter einem Reverse Proxy -- Traefik,
# Caddy, nginx-proxy-manager oder dem vorhandenen nginx des Vereins --, und der
# terminiert das Zertifikat. Zwei Stellen, die TLS zu beenden versuchen, sind
# eine Fehlerquelle und keine doppelte Sicherheit.
#
# Wer den Stack direkt ins Netz stellt, nimmt deploy/nginx.conf als Vorlage und
# hängt sie über ein Volume hier hinein.
# ──────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    # NUR public/. Eine Ebene höher wären .env, storage/ und der gesamte
    # Anwendungscode über HTTP lesbar -- der eine Fehler, der aus einer sauberen
    # Installation eine offene macht.
    root /var/www/aeronance/public;
    index index.php;

    client_max_body_size 32m;

    # Der Proxy davor kennt das echte Schema. Ohne diese Weitergabe baut Laravel
    # http-Adressen in eine https-Seite und der Browser blockiert sie.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS $http_x_forwarded_proto;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    # Kein zweiter Einstieg. Ohne das kann eine hochgeladene Datei mit .php im
    # Namen ausgeführt werden, wenn sie je unter public/ landet.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
