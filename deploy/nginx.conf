# Aeronance -- nginx-Beispiel.
#
# Zielbild ist ein eigener Server oder Container mit Root-Zugriff, kein Shared
# Webspace (CLAUDE.md, Distribution). Anpassen: server_name, die Pfade und das
# PHP-FPM-Socket.
#
# Der Document-Root zeigt auf public/ und NUR dorthin. Zeigte er eine Ebene
# höher, wären .env, storage/ und der gesamte Anwendungscode über HTTP lesbar --
# das ist der eine Fehler, der aus einer sauberen Installation eine offene macht.

server {
    listen 80;
    listen [::]:80;
    server_name werkstatt.example.org;

    # Alles über HTTPS. Der ACME-Pfad bleibt offen, sonst kann sich das
    # Zertifikat nicht erneuern.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name werkstatt.example.org;

    root /var/www/aeronance/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/werkstatt.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/werkstatt.example.org/privkey.pem;

    # HSTS erst einschalten, wenn HTTPS wirklich steht -- ein Browser merkt
    # sich das und lässt danach kein http mehr zu.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    # Dokumente (Form 1, CRS, Fotos) liegen auf einer privaten Disk ausserhalb
    # des Document-Roots und werden nur über auth-geprüfte Controller
    # ausgeliefert. Hier ist also nichts freizugeben.

    # Grosszügig genug für einen eingescannten Wägebericht.
    client_max_body_size 32m;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm-aeronance.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;

        # Ein Inventurbericht über ein grosses Lager darf dauern.
        fastcgi_read_timeout 120;
    }

    # Punktdateien bleiben unerreichbar -- ausser dem ACME-Pfad oben.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
