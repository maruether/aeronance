# Piper Aircraft -- der SB/SL-Index (P/N 762-332).
#
# ─────────────────────────────────────────────────────────────────────────────
# DECKT DIE BEIDEN KLASSISCHEN SCHLEPPMASCHINEN AB: PA-18 Super Cub und PA-25
# Pawnee. 55 Seiten, quartalsweise gepflegt (Stand 30.06.2026), frei abrufbar --
# und die einzige der geprueften US-Quellen mit Ausgabedatum UND AD-Querverweis.
#
# DREI HUERDEN, alle gemessen und alle allgemein (docs/LTA-TM.md):
#
#   1. Je Seite eigene Spaltenpositionen. Als EIN Dokument gemessen kamen 97 von
#      rund 2000 Eintraegen heraus, mit Nummer, Gegenstand und Datum verschiedener
#      Zeilen vermischt.  ->  columns_per_page
#
#   2. Nummer und Gegenstand stehen ein Leerzeichen auseinander. Mit -layout
#      rendert pdftotext beide als EINEN Textlauf ("2 Special Tubing in
#      Fuselage") -- keine Spaltenmessung holt eine Grenze zurueck, die in der
#      Ausgabe nicht steht.  ->  text_mode: -fixed 2
#
#   3. Das Datum steht amerikanisch. "2/15/46" ist eindeutig, "1/7/26" nicht --
#      und die meisten sind vom zweiten Typ.  ->  date_order: mdy
#
# Dem Index steht eine mehrspaltige SUPERSESSION LIST voran, die zeigt, welches
# Bulletin welches ersetzt. Ihre Eintraege sind Verweise und keine Anweisungen;
# sie stehen deshalb in `ignore`, zusammen mit Teilenummern und ATA-Codes, die
# bei driftenden Spalten in die Nummernspalte rutschen.
# ─────────────────────────────────────────────────────────────────────────────

name: piper
label: 'Piper Aircraft (SB/SL-Index)'
issuer: 'Piper Aircraft'
type: overview
default_kind: sb
subject_kind: aircraft_model
overview:
  number_pattern: '#^\d{1,4}[A-Z]?$#'
  columns_per_page: true
  text_mode: '-fixed 2'
  date_order: 'mdy'
  ignore: '#(SB\s+\d|SL\s+\d|Obsolete|Not Used|N/A|^PA-|^STINSON|^J[0-9]|^E[0-9]|^L-|^HE-|^AE-|^[ivxlc]+$|Superseded|New Pub|or Reason|^\d{3,6}-\d|^\d{4}-\d{2}-\d{2}|^\d+\s+\d|^\d{2}-\d{2}-\d{2}|^\*|^-|^SK-|^\d+[A-Za-z]+\d|^\d{5,}|Placard|^\d+\s*/\s*\d|^SAIB|^PARA|^\(|^SL\d|^\d+\.\s|^\d+-\d+[A-Z]?\s|^VB-|^LW-|^or$|^\d+-\d+-\d+|^Practices)#i'
  headings:
    number: ['number']
    title: ['subject']
    subject: ['affected']
    date: ['effectivity', 'date']
    authority: ['a.d.']
  documents:
    'PA-18': 'https://www.piper.com/wp-content/uploads/2026/07/762-332-Service-Bulletin-Letter-Index-4.pdf'
